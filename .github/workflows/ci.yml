name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: 검사와 빌드
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 패키지 빌드
        run: pnpm build:packages

      - name: 타입 검사
        run: pnpm typecheck

      - name: 테스트
        run: pnpm test

      - name: 포맷 검사
        run: pnpm format:check

      - name: 토큰과 아이콘 재생성 비교
        run: |
          pnpm tokens:check
          pnpm icons:check

      - name: 배포물 검사
        run: pnpm lint:package

      - name: 문서 빌드와 링크 검사
        run: |
          pnpm docs:build
          pnpm docs:variants
          pnpm docs:links

      - name: Storybook 빌드
        run: pnpm storybook:build

  consumer:
    name: 소비자 스모크 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 새 Vite 앱에 설치하고 빌드
        run: node scripts/smoke-consumer.mjs
