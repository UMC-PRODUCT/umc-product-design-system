name: Version

on:
  push:
    branches: [develop]

concurrency:
  group: version
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    name: 버전 PR 만들기
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 쌓인 changeset으로 버전 PR 열기
        uses: changesets/action@v2
        with:
          version-script: pnpm version-packages
          pr-title: "chore: 패키지 버전 올리기"
          commit-message: "chore: 패키지 버전 올리기"
