name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  publish:
    name: GitHub Packages 배포
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com
          scope: "@umc-product"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Git 사용자 설정
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 레지스트리에 없는 버전 배포
        run: pnpm release

      - name: 배포 태그 push
        if: ${{ !cancelled() }}
        run: git push origin --tags

      - name: GitHub Release 만들기
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./packages/react/package.json').version")
          tag="@umc-product/react@${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release ${version}은 이미 있습니다"
            exit 0
          fi
          node scripts/release-notes.mjs "$version" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$tag" --title "$version" --notes-file "$RUNNER_TEMP/release-notes.md"
