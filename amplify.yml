version: 1
applications:
  - appRoot: apps/docs
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 22
            - npm install -g pnpm@10.28.0
            - pnpm install --frozen-lockfile
        build:
          commands:
            - pnpm run build
            - pnpm run links:check
      artifacts:
        baseDirectory: dist
        files:
          - "**/*"
  - appRoot: apps/storybook
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 22
            - npm install -g pnpm@10.28.0
            - pnpm install --frozen-lockfile
        build:
          commands:
            - pnpm run build
      artifacts:
        baseDirectory: storybook-static
        files:
          - "**/*"
