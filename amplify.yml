version: 1
applications:
  - appRoot: apps/docs
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 22
            - npm install -g pnpm@10.28.0
            - pnpm install --frozen-lockfile
        build:
          commands:
            - pnpm run build:amplify
      artifacts:
        baseDirectory: amplify-dist
        files:
          - "**/*"
